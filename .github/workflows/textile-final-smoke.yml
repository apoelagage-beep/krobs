name: Textile final smoke

on:
  push:
    branches:
      - feature/textile-checkout-printful
    paths:
      - .github/workflows/textile-final-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate latest preview checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://krobs-git-feature-textile-checkout-printful-apoelagage-4467.vercel.app'
          curl --fail --silent --show-error "$BASE/api/printful-products" -o /tmp/products.json
          python3 - <<'PY' > /tmp/data.env
          import json, shlex
          data=json.load(open('/tmp/products.json'))
          for entry in data.get('products', []):
              product=entry.get('sync_product') or entry
              for variant in entry.get('sync_variants') or []:
                  status=str(variant.get('availability_status') or '').lower()
                  if not variant.get('id') or not variant.get('synced') or variant.get('is_ignored'):
                      continue
                  if status in {'discontinued','out_of_stock','temporary_out_of_stock'}:
                      continue
                  if str(variant.get('currency') or 'EUR').upper() != 'EUR':
                      continue
                  price=float(variant.get('retail_price') or 0)
                  if price <= 0:
                      continue
                  print('PRODUCT_ID='+shlex.quote(str(product.get('id'))))
                  print('VARIANT_ID='+shlex.quote(str(variant.get('id'))))
                  print('REAL_PRICE='+shlex.quote(str(variant.get('retail_price'))))
                  raise SystemExit
          raise SystemExit('No active EUR variant')
          PY
          set -a; source /tmp/data.env; set +a
          BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'cart':[{
            'type':'printful',
            'id':'final-smoke',
            'productId':os.environ['PRODUCT_ID'],
            'syncVariantId':os.environ['VARIANT_ID'],
            'name':'CLIENT FAKE NAME',
            'size':'CLIENT_FAKE_SIZE',
            'color':'CLIENT_FAKE_COLOR',
            'unitAmount':1,
            'qty':1
          }]}))
          PY
          )
          STATUS=$(curl --silent --show-error -o /tmp/checkout.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data "$BODY" \
            "$BASE/api/create-checkout-session")
          cat /tmp/checkout.json
          echo
          test "$STATUS" = '200'
          python3 - <<'PY'
          import json,re
          data=json.load(open('/tmp/checkout.json'))
          url=data.get('url','')
          m=re.search(r'(cs_test_[A-Za-z0-9]+)', url)
          if not m:
              raise SystemExit('Expected Stripe test Checkout session')
          print('SMOKE_OK session='+m.group(1))
          PY
          echo "REAL_PRICE=$REAL_PRICE"
