name: Textile checkout smoke test

on:
  push:
    branches:
      - feature/textile-checkout-printful
    paths:
      - .github/workflows/textile-checkout-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create textile test Checkout session
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://krobs-git-feature-textile-checkout-printful-apoelagage-4467.vercel.app'
          curl --fail --silent --show-error "$BASE/api/printful-products" -o /tmp/products.json
          python3 - <<'PY' > /tmp/test-data.env
          import json, shlex
          data=json.load(open('/tmp/products.json'))
          for entry in data.get('products', []):
              product=entry.get('sync_product') or entry
              for variant in entry.get('sync_variants') or []:
                  if not variant.get('id') or not variant.get('synced') or variant.get('is_ignored'):
                      continue
                  status=str(variant.get('availability_status') or '').lower()
                  if status in {'discontinued','out_of_stock','temporary_out_of_stock'}:
                      continue
                  if float(variant.get('retail_price') or 0) <= 0 or str(variant.get('currency') or 'EUR').upper() != 'EUR':
                      continue
                  print(f"PRODUCT_ID={shlex.quote(str(product.get('id')))}")
                  print(f"VARIANT_ID={shlex.quote(str(variant.get('id')))}")
                  print(f"PRODUCT_NAME={shlex.quote(str(product.get('name') or 'KRØBS TEXTILE'))}")
                  raise SystemExit
          raise SystemExit('No active EUR Printful variant found')
          PY
          set -a; source /tmp/test-data.env; set +a
          BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'cart':[{'type':'printful','id':'browser-smoke','productId':os.environ['PRODUCT_ID'],'syncVariantId':os.environ['VARIANT_ID'],'name':os.environ['PRODUCT_NAME'],'unitAmount':1,'qty':1}]}))
          PY
          )
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data "$BODY" "$BASE/api/create-checkout-session" -o /tmp/checkout.json
          python3 - <<'PY'
          import json,re
          url=json.load(open('/tmp/checkout.json'))['url']
          m=re.search(r'(cs_test_[A-Za-z0-9]+)',url)
          if not m: raise SystemExit('Not a Stripe test Checkout session')
          open('/tmp/checkout-url.txt','w').write(url)
          open('/tmp/session-id.txt','w').write(m.group(1))
          print('SESSION_ID='+m.group(1))
          PY

      - name: Pay with Stripe test card
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import time

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          driver=webdriver.Chrome(options=opts)
          wait=WebDriverWait(driver, 30)

          def fill(name, value):
              e=wait.until(EC.element_to_be_clickable((By.NAME,name)))
              e.clear()
              e.send_keys(value)

          try:
              driver.get(open('/tmp/checkout-url.txt').read().strip())
              wait.until(EC.presence_of_element_located((By.NAME,'email')))
              fill('email','krobs.textile.test@example.com')
              fill('shippingName','KRØBS Textile Test')
              fill('shippingAddressLine1','1 Rue de Rivoli')
              fill('shippingPostalCode','75001')
              fill('shippingLocality','Paris')
              fill('phoneNumber','0612345678')
              fill('cardNumber','4242424242424242')
              fill('cardExpiry','1234')
              fill('cardCvc','123')

              pay=wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR,"button[type='submit']")))
              print('PAY_BUTTON=',pay.text)
              pay.click()

              end=time.time()+50
              while time.time()<end:
                  url=driver.current_url
                  body=driver.find_element(By.TAG_NAME,'body').text
                  if '/success' in url:
                      print('SUCCESS_REDIRECT=',url.split('?')[0])
                      print('SUCCESS_BODY=',body[:1000])
                      break
                  if 'Your card was declined' in body or 'incomplete' in body.lower():
                      raise SystemExit('Stripe test payment failed: '+body[-1200:])
                  time.sleep(1)
              else:
                  print('FINAL_URL=',driver.current_url.split('#')[0])
                  print('FINAL_BODY=',driver.find_element(By.TAG_NAME,'body').text[-2000:])
                  raise SystemExit('Timed out waiting for Stripe Checkout completion')
          finally:
              driver.quit()
          PY

      - name: Print session id for verification
        shell: bash
        run: echo "SESSION_ID=$(cat /tmp/session-id.txt)"
