name: Textile checkout smoke test

on:
  push:
    branches:
      - feature/textile-checkout-printful
    paths:
      - .github/workflows/textile-checkout-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production Stripe checkout without payment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://krobs.vercel.app'
          BODY='{"cart":[{"id":"block-01-deck","name":"BLOCK 01 DECK","size":"8.25","unitAmount":1,"qty":1}]}'

          STATUS=$(curl --silent --show-error -o /tmp/checkout.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "$BASE/api/create-checkout-session")

          cat /tmp/checkout.json
          echo
          test "$STATUS" = '200'

          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/checkout.json'))
          url=data.get('url','')
          if not url.startswith('https://checkout.stripe.com/'):
              raise SystemExit(f'Unexpected Stripe Checkout URL: {url!r}')
          print('CHECKOUT_URL='+url)
          PY
