name: Textile checkout smoke test

on:
  push:
    branches:
      - feature/textile-checkout-printful
    paths:
      - .github/workflows/textile-checkout-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create textile test Checkout session
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://krobs-git-feature-textile-checkout-printful-apoelagage-4467.vercel.app'
          curl --fail --silent --show-error "$BASE/api/printful-products" -o /tmp/products.json
          python3 - <<'PY' > /tmp/test-data.env
          import json, shlex
          data=json.load(open('/tmp/products.json'))
          for entry in data.get('products', []):
              product=entry.get('sync_product') or entry
              for variant in entry.get('sync_variants') or []:
                  if not variant.get('id') or not variant.get('synced') or variant.get('is_ignored'):
                      continue
                  status=str(variant.get('availability_status') or '').lower()
                  if status in {'discontinued','out_of_stock','temporary_out_of_stock'}:
                      continue
                  if float(variant.get('retail_price') or 0) <= 0 or str(variant.get('currency') or 'EUR').upper() != 'EUR':
                      continue
                  print(f"PRODUCT_ID={shlex.quote(str(product.get('id')))}")
                  print(f"VARIANT_ID={shlex.quote(str(variant.get('id')))}")
                  print(f"PRODUCT_NAME={shlex.quote(str(product.get('name') or 'KRØBS TEXTILE'))}")
                  raise SystemExit
          raise SystemExit('No active EUR Printful variant found')
          PY
          set -a; source /tmp/test-data.env; set +a
          BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'cart':[{'type':'printful','id':'browser-smoke','productId':os.environ['PRODUCT_ID'],'syncVariantId':os.environ['VARIANT_ID'],'name':os.environ['PRODUCT_NAME'],'unitAmount':1,'qty':1}]}))
          PY
          )
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data "$BODY" "$BASE/api/create-checkout-session" -o /tmp/checkout.json
          python3 - <<'PY'
          import json
          url=json.load(open('/tmp/checkout.json'))['url']
          if 'cs_test_' not in url: raise SystemExit('Not a Stripe test Checkout session')
          open('/tmp/checkout-url.txt','w').write(url)
          print('Created Stripe test Checkout session')
          PY

      - name: Probe Checkout DOM in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json, time
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=opts)
          try:
              url=open('/tmp/checkout-url.txt').read().strip()
              driver.get(url)
              time.sleep(5)
              print('TITLE:', driver.title)
              print('URL:', driver.current_url.split('#')[0])
              print('BODY:\n', driver.find_element('tag name','body').text[:8000])
              rows=[]
              for i,e in enumerate(driver.find_elements('css selector','input,select,button')):
                  rows.append({
                    'i':i,'tag':e.tag_name,'type':e.get_attribute('type'),'name':e.get_attribute('name'),
                    'id':e.get_attribute('id'),'placeholder':e.get_attribute('placeholder'),
                    'aria':e.get_attribute('aria-label'),'autocomplete':e.get_attribute('autocomplete'),
                    'text':e.text,'value':e.get_attribute('value'),'enabled':e.is_enabled()
                  })
              print('FIELDS:', json.dumps(rows, ensure_ascii=False, indent=2))
          finally:
              driver.quit()
          PY
